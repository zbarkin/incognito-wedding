<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Measuring walkthrough · Sam</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../dc-lite.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Rokkitt:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#121110}
a{color:#C9A66B}a:hover{color:#E2C48E}
.fld:focus{outline:none;border-color:#C9A66B !important;box-shadow:0 0 0 3px rgba(201,166,107,.25)}
.fld::placeholder{color:#8E8676}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.btn:hover{background:#D4B47A !important}
.ghost:hover{border-color:#C9A66B !important}
a:focus-visible,button:focus-visible{outline:2px solid #E2C48E;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div style="width:390px; min-height:1320px; box-sizing:border-box; background:#121110; color:#EEE7D9; font-family:Archivo, sans-serif; color-scheme:dark; display:flex; flex-direction:column;">

<header style="background:#0C0B0A; border-bottom:1px solid #2E2923; padding:12px 20px 12px 12px; display:flex; align-items:center; justify-content:space-between;">
<a href="Member.dc.html" style="display:flex; align-items:center; gap:6px; height:44px; padding:0 8px; color:#EEE7D9; text-decoration:none; font-size:15px; font-weight:600;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9A66B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>Close</a>
<span aria-live="polite" style="font-family:Archivo, sans-serif; font-stretch:125%; font-weight:600; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:#C9A66B;">{{stepText}}</span>
</header>

<main style="flex:1 0 auto; padding:20px 20px 28px; display:flex; flex-direction:column; gap:20px;">

<div role="img" aria-label="{{progressLabel}}" style="display:grid; grid-template-columns:repeat(10, minmax(0, 1fr)); gap:4px;">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="10">
<span style="height:14px; box-sizing:border-box; background:{{t.bg}}; border:{{t.border}};"></span>
</sc-for>
</div>

<div style="display:flex; align-items:flex-end; justify-content:space-between; gap:12px;">
<div style="display:flex; flex-direction:column; gap:6px;">
<span style="font-size:14px; color:#A39A8B;">Grab a soft tape measure and a friend.</span>
<h1 style="margin:0; font-family:Rokkitt, serif; font-weight:600; font-size:40px; line-height:1; color:#EEE7D9;">{{cur.name}}</h1>
</div>
<button type="button" class="ghost" aria-pressed="{{paused}}" aria-label="{{pauseLabel}}" onClick="{{togglePause}}" style="flex:0 0 44px; width:44px; height:44px; display:flex; align-items:center; justify-content:center; padding:0; background:transparent; border:1px solid #4A4237; border-radius:2px; cursor:pointer;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#C9A66B"><path d="{{pauseIcon}}"></path></svg></button>
</div>

<dc-import name="HowTo" which="{{cur.key}}" still="{{paused}}" steps="{{true}}" hint-size="100%,560px"></dc-import>

<div style="display:flex; flex-direction:column; gap:10px; padding:18px; background:#1A1816; border:1px solid #38322A;">
<sc-if value="{{cur.isNum}}" hint-placeholder-val="{{true}}">
<label for="g-input" style="font-family:Archivo, sans-serif; font-stretch:125%; font-weight:600; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#A39A8B;">Your {{cur.lower}}<span class="sr">{{cur.srUnit}}</span></label>
<div style="position:relative;">
<input id="g-input" class="fld" type="number" step="{{cur.step}}" min="0" placeholder="{{cur.ph}}" value="{{cur.value}}" onChange="{{cur.set}}" style="box-sizing:border-box; width:100%; height:56px; padding:0 52px 0 16px; background:#0F0E0D; border:1px solid {{cur.bd}}; border-radius:2px; color:#EEE7D9; font-family:Rokkitt, serif; font-weight:600; font-size:24px;">
<span aria-hidden="true" style="position:absolute; right:16px; top:19px; font-size:15px; color:#8E8676;">{{cur.unit}}</span>
</div>
</sc-if>
<sc-if value="{{cur.isHeight}}" hint-placeholder-val="{{false}}">
<span id="g-height" style="font-family:Archivo, sans-serif; font-stretch:125%; font-weight:600; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#A39A8B;">Your height</span>
<div role="group" aria-labelledby="g-height" style="display:flex; gap:8px;">
<div style="position:relative; flex:1 1 0;">
<select class="fld" aria-label="Feet" value="{{vals.ft}}" onChange="{{setFt}}" style="box-sizing:border-box; width:100%; height:56px; padding:0 34px 0 14px; appearance:none; background:#0F0E0D; border:1px solid #38322A; border-radius:2px; color:#EEE7D9; font-family:Archivo, sans-serif; font-size:18px;">
<option value="">ft</option>
<option value="4">4 ft</option>
<option value="5">5 ft</option>
<option value="6">6 ft</option>
<option value="7">7 ft</option>
</select>
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C9A66B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; right:12px; top:21px; pointer-events:none;"><path d="m6 9 6 6 6-6"></path></svg>
</div>
<div style="position:relative; flex:1 1 0;">
<select class="fld" aria-label="Inches" value="{{vals.inch}}" onChange="{{setInch}}" style="box-sizing:border-box; width:100%; height:56px; padding:0 34px 0 14px; appearance:none; background:#0F0E0D; border:1px solid #38322A; border-radius:2px; color:#EEE7D9; font-family:Archivo, sans-serif; font-size:18px;">
<option value="">in</option>
<option value="0">0 in</option>
<option value="1">1 in</option>
<option value="2">2 in</option>
<option value="3">3 in</option>
<option value="4">4 in</option>
<option value="5">5 in</option>
<option value="6">6 in</option>
<option value="7">7 in</option>
<option value="8">8 in</option>
<option value="9">9 in</option>
<option value="10">10 in</option>
<option value="11">11 in</option>
</select>
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C9A66B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; right:12px; top:21px; pointer-events:none;"><path d="m6 9 6 6 6-6"></path></svg>
</div>
</div>
</sc-if>
<sc-if value="{{cur.isShoe}}" hint-placeholder-val="{{false}}">
<label for="g-shoe" style="font-family:Archivo, sans-serif; font-stretch:125%; font-weight:600; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#A39A8B;">Your dress shoe size</label>
<div style="position:relative;">
<select id="g-shoe" class="fld" value="{{vals.shoe}}" onChange="{{setShoe}}" style="box-sizing:border-box; width:100%; height:56px; padding:0 34px 0 14px; appearance:none; background:#0F0E0D; border:1px solid #38322A; border-radius:2px; color:#EEE7D9; font-family:Archivo, sans-serif; font-size:18px;">
<option value="">Choose a size</option>
<option>7</option>
<option>7.5</option>
<option>8</option>
<option>8.5</option>
<option>9</option>
<option>9.5</option>
<option>10</option>
<option>10.5</option>
<option>11</option>
<option>11.5</option>
<option>12</option>
<option>13</option>
<option>14</option>
<option>15</option>
<option value="none">I don’t need shoes</option>
</select>
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C9A66B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; right:12px; top:21px; pointer-events:none;"><path d="m6 9 6 6 6-6"></path></svg>
</div>
</sc-if>
</div>

<div style="display:flex; gap:10px;">
<sc-if value="{{hasPrev}}" hint-placeholder-val="{{true}}">
<button type="button" class="ghost" onClick="{{prev}}" aria-label="{{prevLabel}}" style="flex:0 0 56px; height:56px; display:flex; align-items:center; justify-content:center; padding:0; background:transparent; border:1px solid #4A4237; border-radius:2px; cursor:pointer;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9A66B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
</sc-if>
<sc-if value="{{notLast}}" hint-placeholder-val="{{true}}">
<button type="button" class="btn" onClick="{{next}}" style="flex:1 1 auto; height:56px; display:flex; align-items:center; justify-content:center; gap:10px; background:#C29E62; color:#15130F; border:0; border-radius:2px; font-family:Archivo, sans-serif; font-stretch:112%; font-weight:700; font-size:14px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer;">{{nextLabel}}<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15130F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</sc-if>
<sc-if value="{{isLast}}" hint-placeholder-val="{{false}}">
<a href="Measure.dc.html" class="btn" style="flex:1 1 auto; height:56px; display:flex; align-items:center; justify-content:center; gap:10px; background:#C29E62; color:#15130F; text-decoration:none; border-radius:2px; font-family:Archivo, sans-serif; font-stretch:112%; font-weight:700; font-size:14px; letter-spacing:.08em; text-transform:uppercase;">Review &amp; send<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15130F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</sc-if>
</div>
<sc-if value="{{notLast}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{next}}" style="align-self:center; height:44px; padding:0 12px; background:transparent; border:0; color:#C9A66B; font-family:Archivo, sans-serif; font-size:15px; font-weight:600; text-decoration:underline; text-underline-offset:3px; cursor:pointer;">Not sure? Skip this one</button>
</sc-if>

<p style="margin:0; padding:14px 16px; border:1px dashed #38322A; font-size:14px; line-height:1.5; color:#A39A8B;">A pro measuring you is always most accurate. Close to Penfield? <a href="Book.dc.html" style="font-weight:600;">Book a visit</a> and we’ll do it in a few minutes.</p>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1320}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = {
      idx: 2,
      paused: false,
      vals: { ft: '5', inch: '11', weight: '175', chest: '', overarm: '', neck: '', sleeve: '', waist: '', hip: '', outseam: '', shoe: '' }
    };
  }
  setVal(key) {
    return (e) => this.setState({ vals: Object.assign({}, this.state.vals, { [key]: e.target.value }) });
  }
  renderVals() {
    const STEPS = [
      { key: 'height', name: 'Height', kind: 'height' },
      { key: 'weight', name: 'Weight', kind: 'num', unit: 'lbs', unitWord: 'pounds', ph: 'e.g. 180', step: '1' },
      { key: 'chest', name: 'Chest', kind: 'num', unit: 'in', unitWord: 'inches', ph: 'e.g. 40', step: '0.25' },
      { key: 'overarm', name: 'Overarm', kind: 'num', unit: 'in', unitWord: 'inches', ph: 'e.g. 47', step: '0.25' },
      { key: 'neck', name: 'Neck', kind: 'num', unit: 'in', unitWord: 'inches', ph: 'e.g. 15.5', step: '0.25' },
      { key: 'sleeve', name: 'Sleeve', kind: 'num', unit: 'in', unitWord: 'inches', ph: 'e.g. 34', step: '0.25' },
      { key: 'waist', name: 'Waist', kind: 'num', unit: 'in', unitWord: 'inches', ph: 'e.g. 34', step: '0.25' },
      { key: 'hip', name: 'Hip', kind: 'num', unit: 'in', unitWord: 'inches', ph: 'e.g. 40', step: '0.25' },
      { key: 'outseam', name: 'Outseam', kind: 'num', unit: 'in', unitWord: 'inches', ph: 'e.g. 43', step: '0.25' },
      { key: 'shoe', name: 'Shoe size', kind: 'shoe' }
    ];
    const s = this.state;
    const i = s.idx;
    const c = STEPS[i];
    const filled = (st) => (st.kind === 'height' ? !!(s.vals.ft && s.vals.inch !== '') : !!s.vals[st.key]);
    const tiles = STEPS.map((st, j) => {
      const done = filled(st);
      const now = j === i;
      return {
        bg: done ? '#C29E62' : '#0F0E0D',
        border: now ? '2px solid #E2C48E' : done ? '1px solid #C29E62' : '1px solid #4A4237'
      };
    });
    const doneCount = STEPS.filter(filled).length;
    const value = c.kind === 'num' ? s.vals[c.key] : '';
    const last = i === STEPS.length - 1;
    return {
      stepText: 'Step ' + (i + 1) + ' of ' + STEPS.length,
      tiles: tiles,
      progressLabel: doneCount + ' of ' + STEPS.length + ' measurements entered',
      cur: {
        key: c.key,
        name: c.name,
        lower: c.name.toLowerCase(),
        isNum: c.kind === 'num',
        isHeight: c.kind === 'height',
        isShoe: c.kind === 'shoe',
        unit: c.unit || '',
        srUnit: c.unitWord ? ' in ' + c.unitWord : '',
        ph: c.ph || '',
        step: c.step || '1',
        value: value,
        bd: value ? '#8C7247' : '#38322A',
        set: this.setVal(c.key)
      },
      vals: s.vals,
      setFt: this.setVal('ft'),
      setInch: this.setVal('inch'),
      setShoe: this.setVal('shoe'),
      paused: s.paused,
      togglePause: () => this.setState({ paused: !s.paused }),
      pauseLabel: s.paused ? 'Play animation' : 'Pause animation',
      pauseIcon: s.paused ? 'M7 4v16l13-8Z' : 'M6 4h4v16H6zM14 4h4v16h-4z',
      hasPrev: i > 0,
      prevLabel: i > 0 ? 'Back to ' + STEPS[i - 1].name.toLowerCase() : 'Back',
      prev: () => this.setState({ idx: Math.max(0, i - 1) }),
      notLast: !last,
      isLast: last,
      nextLabel: last ? '' : 'Next: ' + STEPS[i + 1].name,
      next: () => this.setState({ idx: Math.min(STEPS.length - 1, i + 1) })
    };
  }
}
</script>
</body>
</html>
