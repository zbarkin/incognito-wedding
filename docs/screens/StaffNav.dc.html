<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["today","parties","appts","orders","pickups","customers"],"default":"today"},"$preview":{"width":240,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    // Counts shown beside each item: things waiting today.
    const COUNTS = { today: [5, false], parties: [5, true], appts: [0, false], orders: [2, true], pickups: [2, true], customers: [0, false] };
    const n = {};
    Object.keys(COUNTS).forEach((k) => {
      const on = this.props.current === k;
      const c = COUNTS[k];
      n[k] = {
        current: on ? 'page' : false,
        bg: on ? '#221F1B' : 'transparent',
        picked: on ? 'is-picked' : '',
        pad: '12px',
        fg: on ? '#EEE7D9' : '#A39A8B',
        icon: on ? '#C9A66B' : '#8E8676',
        hasCount: c[0] > 0,
        count: c[0],
        capClass: c[1] ? 'kk-cap is-red' : 'kk-cap is-grey'
      };
    });
    return { n: n };
  }
}
</script>
