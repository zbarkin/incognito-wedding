<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prom lookbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../dc-lite.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://use.typekit.net/euq1ofl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Rokkitt:wght@400;600;700&amp;family=Jost:wght@300;400;500;600;700&amp;family=Plaster&amp;family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;display=swap">
<style>body{margin:0}html{overflow-x:hidden}</style>
</helmet>
<section aria-labelledby="look-book" style="width:100%; min-width:0; box-sizing:border-box; display:flex; flex-direction:column; gap:18px; padding-top:28px; border-top:1px solid {{t.line}};">
<div style="display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px 24px;">
<h2 id="look-book" style="margin:0; font-family:{{t.head}}; font-weight:{{t.headWeight}}; font-size:32px; line-height:1.1; color:{{t.headColor}};">{{t.lookTitle}}</h2>
<span style="font-size:14px; color:{{t.muted}};">{{t.lookSub}}</span>
</div>
<sc-if value="{{is.kodak}}" hint-placeholder-val="{{true}}">
<div style="display:flex; align-items:center; min-width:0; margin-left:calc(50% - 50vw); width:calc(50vw + 50%);">
<svg aria-hidden="true" width="214" height="535" viewBox="0 0 92 230" style="flex:0 0 214px; height:535px; position:relative; z-index:1; margin-right:-6px;">
<rect x="26" y="0" width="40" height="22" rx="6" fill="#0B0B0C"></rect>
<rect x="8" y="16" width="76" height="200" rx="10" fill="#111111" stroke="#2A2A2A" stroke-width="2"></rect>
<rect x="8" y="40" width="22" height="152" fill="#F2B11A"></rect>
<rect x="8" y="196" width="76" height="20" rx="8" fill="#0B0B0C"></rect>
<text x="22" y="182" transform="rotate(-90 22 182)" font-family="Archivo, sans-serif" font-weight="700" font-size="11" letter-spacing="2" fill="#15130F">C-41</text>
<text x="58" y="198" transform="rotate(-90 58 198)" font-family="norman-stencil-fat, Rokkitt, serif" font-weight="800" font-size="20" fill="#EEE7D9">INCOGNITO 400</text>
<text x="76" y="198" transform="rotate(-90 76 198)" font-family="Archivo, sans-serif" font-weight="600" font-size="8.5" letter-spacing="1.5" fill="#E86A5E">FILM FOR PROM NIGHT</text>
</svg>
<div style="flex:1 1 auto; min-width:0; background:#F6EEDF; padding:0 0 0 18px; border-radius:0 4px 4px 0;">
<div aria-hidden="true" style="height:22px; background-image:repeating-linear-gradient(90deg, #F6EEDF 0 9px, #E9DCC4 9px 21px, #F6EEDF 21px 30px); background-size:100% 10px; background-repeat:no-repeat; background-position:0 center;"></div>
<div aria-hidden="true" style="height:16px; display:flex; align-items:center; gap:120px; padding-left:8px; font-family:Archivo, sans-serif; font-weight:700; font-size:10px; letter-spacing:.14em; color:#9C5C12; white-space:nowrap; overflow:hidden;"><span>INCOGNITO 400</span><span>&#9654; {{film.edgeA}}</span><span>{{film.edgeB}}</span><span>INCOGNITO 400</span><span>&#9654; {{film.edgeC}}</span></div>
<div style="overflow:hidden; padding:8px 0;">
<div style="display:flex; gap:22px; transform:translateX({{film.x}}px);">
<sc-for list="{{looks}}" as="lk" hint-placeholder-count="4">
<figure aria-current="{{lk.current}}" style="position:relative; flex:0 0 300px; height:420px; margin:0; overflow:hidden; background:#F3ECDD; outline:{{lk.outline}}; outline-offset:3px;">
<img src="{{lk.src}}" alt="{{lk.alt}}" loading="lazy" style="display:block; width:100%; height:100%; object-fit:cover; object-position:{{lk.pos}}; filter:{{t.photoFilter}};">
<sc-if value="{{lk.open}}" hint-placeholder-val="{{false}}">
<figcaption id="{{lk.capId}}" style="position:absolute; left:0; right:0; bottom:0; box-sizing:border-box; padding:14px 52px 14px 14px; background:rgba(243,236,221,0.86); color:#1E1A15; display:flex; flex-direction:column; gap:4px; text-align:left;"><span style="font-size:15px; line-height:1.4;">{{lk.caption}}</span><a href="{{lk.page}}" target="_blank" rel="noopener" style="font-size:12px; line-height:1.4; color:#3A342C;">{{lk.credit}}</a></figcaption>
</sc-if>
<button type="button" aria-expanded="{{lk.open}}" aria-controls="{{lk.capId}}" aria-label="{{lk.btnLabel}}" onClick="{{lk.toggle}}" style="position:absolute; right:10px; bottom:10px; width:32px; height:32px; padding:0; display:flex; align-items:center; justify-content:center; background:{{lk.btnBg}}; color:{{lk.btnFg}}; border:1px solid rgba(30,26,21,0.77); border-radius:50%; font-family:Georgia, serif; font-style:italic; font-weight:700; font-size:16px; line-height:1; cursor:pointer;">{{lk.mark}}</button>
</figure>
</sc-for>
</div>
</div>
<div aria-hidden="true" style="height:16px; display:flex; align-items:center; gap:140px; padding-left:40px; font-family:Archivo, sans-serif; font-weight:700; font-size:10px; letter-spacing:.14em; color:#9C5C12; white-space:nowrap; overflow:hidden;"><span>1</span><span>1A</span><span>2</span><span>2A</span><span>3</span><span>3A</span><span>4</span></div>
<div aria-hidden="true" style="height:22px; background-image:repeating-linear-gradient(90deg, #F6EEDF 0 9px, #E9DCC4 9px 21px, #F6EEDF 21px 30px); background-size:100% 10px; background-repeat:no-repeat; background-position:0 center;"></div>
</div>
</div>
<div style="display:flex; align-items:center; justify-content:flex-end; gap:12px;">
<span aria-live="polite" style="font-family:Archivo, sans-serif; font-weight:700; font-size:13px; letter-spacing:.16em; color:#A77709;">FRAME {{film.n}} / {{film.total}}</span>
<button type="button" aria-label="Previous frame" onClick="{{film.prev}}" style="width:48px; height:48px; padding:0; background:#F2B11A; color:#15130F; border:0; border-radius:2px; font-weight:800; font-size:22px; cursor:pointer;">&#8249;</button>
<button type="button" aria-label="Next frame" onClick="{{film.next}}" style="width:48px; height:48px; padding:0; background:#F2B11A; color:#15130F; border:0; border-radius:2px; font-weight:800; font-size:22px; cursor:pointer;">&#8250;</button>
</div>
</sc-if>
<sc-if value="{{is.birch}}" hint-placeholder-val="{{false}}">
<div style="width:100vw; margin-left:calc(50% - 50vw); box-sizing:border-box; background:#FFFFFF; padding:8px;">
<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap:8px;">
<sc-for list="{{looks}}" as="lk" hint-placeholder-count="4">
<figure style="position:relative; margin:0; aspect-ratio:3 / 4; overflow:hidden; background:#EDEDED;">
<img src="{{lk.src}}" alt="{{lk.alt}}" loading="lazy" style="display:block; width:100%; height:100%; object-fit:cover; object-position:{{lk.pos}}; filter:{{t.photoFilter}};">
<sc-if value="{{lk.open}}" hint-placeholder-val="{{false}}">
<figcaption id="{{lk.capId}}" style="position:absolute; left:0; right:0; bottom:0; box-sizing:border-box; padding:14px 52px 14px 14px; background:rgba(243,236,221,0.86); color:#1E1A15; display:flex; flex-direction:column; gap:4px; text-align:left;"><span style="font-size:15px; line-height:1.4;">{{lk.caption}}</span><a href="{{lk.page}}" target="_blank" rel="noopener" style="font-size:12px; line-height:1.4; color:#3A342C;">{{lk.credit}}</a></figcaption>
</sc-if>
<button type="button" aria-expanded="{{lk.open}}" aria-controls="{{lk.capId}}" aria-label="{{lk.btnLabel}}" onClick="{{lk.toggle}}" style="position:absolute; right:10px; bottom:10px; width:32px; height:32px; padding:0; display:flex; align-items:center; justify-content:center; background:{{lk.btnBg}}; color:{{lk.btnFg}}; border:1px solid rgba(30,26,21,0.77); border-radius:50%; font-family:Georgia, serif; font-style:italic; font-weight:700; font-size:16px; line-height:1; cursor:pointer;">{{lk.mark}}</button>
</figure>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{is.park}}" hint-placeholder-val="{{false}}">
<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap:34px; padding:10px 4px 6px;">
<sc-for list="{{looks}}" as="lk" hint-placeholder-count="4">
<div style="padding:16px; background-color:#5A3A22; background-image:repeating-linear-gradient(92deg, rgba(243,236,221,0.18) 0 2px, rgba(0,0,0,0) 2px 7px, rgba(30,26,21,0.03) 7px 8px, rgba(0,0,0,0) 8px 13px), linear-gradient(135deg, #7A5232 0%, #4E301B 45%, #6B4428 70%, #3E2615 100%); box-shadow:inset 0 0 0 1px #2A170B, inset 0 0 0 4px #8A6338, inset 0 0 0 6px #C6A867, 0 16px 30px rgba(243,236,221,0.55);">
<div style="padding:14px; background:#F2EAD8; box-shadow:inset 0 2px 6px rgba(60,45,25,0.122);">
<figure style="position:relative; margin:0; aspect-ratio:4 / 5; overflow:hidden; background:#E5DBC4;">
<img src="{{lk.src}}" alt="{{lk.alt}}" loading="lazy" style="display:block; width:100%; height:100%; object-fit:cover; object-position:{{lk.pos}}; filter:{{t.photoFilter}};">
<sc-if value="{{lk.open}}" hint-placeholder-val="{{false}}">
<figcaption id="{{lk.capId}}" style="position:absolute; left:0; right:0; bottom:0; box-sizing:border-box; padding:14px 52px 14px 14px; background:rgba(243,236,221,0.86); color:#1E1A15; display:flex; flex-direction:column; gap:4px; text-align:left;"><span style="font-size:15px; line-height:1.4;">{{lk.caption}}</span><a href="{{lk.page}}" target="_blank" rel="noopener" style="font-size:12px; line-height:1.4; color:#3A342C;">{{lk.credit}}</a></figcaption>
</sc-if>
<button type="button" aria-expanded="{{lk.open}}" aria-controls="{{lk.capId}}" aria-label="{{lk.btnLabel}}" onClick="{{lk.toggle}}" style="position:absolute; right:10px; bottom:10px; width:32px; height:32px; padding:0; display:flex; align-items:center; justify-content:center; background:{{lk.btnBg}}; color:{{lk.btnFg}}; border:1px solid rgba(30,26,21,0.77); border-radius:50%; font-family:Georgia, serif; font-style:italic; font-weight:700; font-size:16px; line-height:1; cursor:pointer;">{{lk.mark}}</button>
</figure>
</div>
</div>
</sc-for>
</div>
</sc-if>
<span style="font-size:13px; color:{{t.muted}};">Images from public collections and free photo libraries, for inspiration only. The people shown aren’t affiliated with the shop.</span>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["kodak","birch","park"],"default":"kodak"},"$preview":{"width":1280,"height":640}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { lookOpen: -1, film: 0 };
  }
  themes() {
    return {
      kodak: { line: '#D5C9B2', muted: '#655C4F', bar: '#F3ECDD', headColor: '#1E1A15', head: 'norman-stencil-fat, Rokkitt, serif', headWeight: 800, body: 'Archivo, sans-serif', text: '#1E1A15',
        lookTitle: 'The lookbook: 1970s', lookSub: 'Wide lapels, velvet, and a city at night.', photoFilter: 'sepia(.25) contrast(1.08) saturate(.9)', look: [{ src: 'https://commons.wikimedia.org/wiki/Special:FilePath/Fashion_for_occasions_from_1976_(JOKAOM14AiD_MUO16-3).tif?width=600', page: 'https://commons.wikimedia.org/wiki/File:Fashion_for_occasions_from_1976_(JOKAOM14AiD_MUO16-3).tif', alt: 'A man in a blue velvet three-piece suit, 1976', caption: 'A velvet three-piece for the big night, 1976', credit: 'Seppo Konstig / Finnish Heritage Agency · CC BY 4.0', pos: 'center top' }, { src: 'https://commons.wikimedia.org/wiki/Special:FilePath/Man_showt_herenmode_bij_het_Nationaal_Monument_op_de_Dam_in_Amsterdam,_Bestanddeelnr_924-3377.jpg?width=600', page: 'https://commons.wikimedia.org/wiki/File:Man_showt_herenmode_bij_het_Nationaal_Monument_op_de_Dam_in_Amsterdam,_Bestanddeelnr_924-3377.jpg', alt: 'A model showing menswear in a city square, 1971', caption: 'Menswear on the street in Amsterdam, 1971', credit: 'Nationaal Archief / Anefo · CC0', pos: 'center' }, { src: 'https://commons.wikimedia.org/wiki/Special:FilePath/Fashion_for_occasions_from_1976_(JOKAOM14AiD_MUO16-1).tif?width=600', page: 'https://commons.wikimedia.org/wiki/File:Fashion_for_occasions_from_1976_(JOKAOM14AiD_MUO16-1).tif', alt: 'A man in a suit, shirt and tie, 1976', caption: 'A suit and tie for an occasion, 1976', credit: 'Seppo Konstig / Finnish Heritage Agency · CC BY 4.0', pos: 'center top' }, { src: 'https://commons.wikimedia.org/wiki/Special:FilePath/ABSTRACT_IN_STEEL_AND_CONCRETE-BUILDINGS_OF_MIDTOWN_MANHATTAN_-_NARA_-_549880.jpg?width=600', page: 'https://commons.wikimedia.org/wiki/File:ABSTRACT_IN_STEEL_AND_CONCRETE-BUILDINGS_OF_MIDTOWN_MANHATTAN_-_NARA_-_549880.jpg', alt: 'Steel and concrete office towers in midtown Manhattan, 1973', caption: 'The city, 1973', credit: 'National Archives / DOCUMERICA · public domain', pos: 'center' }], },
      birch: { line: '#E2DAC9', muted: '#6B5D4B', bar: '#F4EEE1', headColor: '#9D7B2F', head: 'cesso, Plaster, Jost, sans-serif', headWeight: 400, body: 'Jost, sans-serif', text: '#1E1A15',
        lookTitle: 'The modern cover', lookSub: 'Black tie now: sharp, simple, quietly expensive.', photoFilter: 'grayscale(1) contrast(1.12)', look: [{ src: 'https://commons.wikimedia.org/wiki/Special:FilePath/17_(Unsplash).jpg?width=700', page: 'https://commons.wikimedia.org/wiki/File:17_(Unsplash).jpg', alt: 'A man in a tuxedo and bow tie with a white boutonniere', caption: 'Black tie with a white boutonniere', credit: 'Alvin Mahmudov via Unsplash · CC0', pos: 'left bottom' }, { src: 'https://commons.wikimedia.org/wiki/Special:FilePath/All_decked_up_(Unsplash).jpg?width=700', page: 'https://commons.wikimedia.org/wiki/File:All_decked_up_(Unsplash).jpg', alt: 'Tuxedos with bow ties on mannequins in a shop window', caption: 'Dinner jackets in a London window', credit: 'Clem Onojeghuo via Unsplash · CC0', pos: 'center' }, { src: 'https://commons.wikimedia.org/wiki/Special:FilePath/Elegant_man_playing_piano_(Unsplash).jpg?width=700', page: 'https://commons.wikimedia.org/wiki/File:Elegant_man_playing_piano_(Unsplash).jpg', alt: 'A man in a suit playing a grand piano', caption: 'A suit at the piano', credit: 'Dominik Scythe via Unsplash · CC0', pos: 'left center' }, { src: 'https://commons.wikimedia.org/wiki/Special:FilePath/Elegant_business_watch_(Unsplash).jpg?width=700', page: 'https://commons.wikimedia.org/wiki/File:Elegant_business_watch_(Unsplash).jpg', alt: 'A shirt cuff and wristwatch on a man in a suit', caption: 'The details: cuff and watch', credit: 'rawpixel via Unsplash · CC0', pos: 'center' }], },
      park: { line: '#DFD7C4', muted: '#7F6E59', bar: '#F6F0E5', headColor: '#40372C', head: "vivaldi-mn, 'Playfair Display', Georgia, serif", headWeight: 400, body: "'EB Garamond', Georgia, serif", text: '#40372C',
        lookTitle: 'From the casebook', lookSub: 'Evening dress, 1885 to 1905.', photoFilter: 'sepia(.35) contrast(1.05)', look: [{ src: 'https://cdn.loc.gov/service/pnp/ppmsca/45100/45122v.jpg', page: 'https://www.loc.gov/pictures/item/2018695756/', alt: 'An illustrated advertisement of men in evening dress, 1905', caption: 'Evening dress, an advertisement from 1905', credit: 'Library of Congress, Prints & Photographs Division', pos: 'center top' }, { src: 'https://commons.wikimedia.org/wiki/Special:FilePath/Sherlock_Holmes_%26_Watson_-_The_Adventure_of_the_Empty_House_-_Sidney_Paget.jpg?width=600', page: 'https://commons.wikimedia.org/wiki/File:Sherlock_Holmes_%26_Watson_-_The_Adventure_of_the_Empty_House_-_Sidney_Paget.jpg', alt: 'An engraving of two Victorian gentlemen in a study', caption: 'Illustration by Sidney Paget, The Strand Magazine, 1903', credit: 'Sidney Paget · public domain', pos: 'center top' }, { src: 'https://commons.wikimedia.org/wiki/Special:FilePath/Evening_suit_MET_41.524a-c_CP4.jpg?width=600', page: 'https://commons.wikimedia.org/wiki/File:Evening_suit_MET_41.524a-c_CP4.jpg', alt: 'A black American evening suit from about 1888 on a form', caption: 'An American evening suit, about 1888', credit: 'The Metropolitan Museum of Art · CC0', pos: 'center' }, { src: 'https://cdn.loc.gov/service/pnp/pga/03100/03142v.jpg', page: 'https://www.loc.gov/pictures/item/2006676665/', alt: 'A tailoring plate of men in overcoats and evening wear, 1899', caption: 'American fashions, a tailoring plate from 1899', credit: 'Library of Congress, Prints & Photographs Division', pos: 'center' }], }
    };
  }
  renderVals() {
    const s = this.state;
    const T = this.themes();
    const key = T[this.props.theme] ? this.props.theme : 'kodak';
    const t = T[key];
    return {
      t: t,
      is: { kodak: key === 'kodak', birch: key === 'birch', park: key === 'park' },
      looks: t.look.map((lk, i) => {
        const open = s.lookOpen === i;
        return Object.assign({}, lk, {
          open: open,
          capId: 'look-cap-' + i,
          mark: open ? '×' : 'i',
          btnLabel: (open ? 'Hide' : 'Show') + ' caption and source',
          btnBg: open ? '#F4F1EA' : 'rgba(10,10,11,.6)',
          btnFg: open ? '#0A0A0B' : '#F4F1EA',
          toggle: () => this.setState({ lookOpen: open ? -1 : i }),
          current: i === s.film,
          outline: i === s.film ? '2px solid #F2B11A' : 'none'
        });
      }),
      film: {
        n: s.film + 1,
        total: t.look.length,
        x: -s.film * 322,
        edgeA: String(s.film * 2 + 1),
        edgeB: String(s.film * 2 + 1) + 'A',
        edgeC: String(s.film * 2 + 2),
        prev: () => this.setState({ film: (s.film - 1 + t.look.length) % t.look.length, lookOpen: -1 }),
        next: () => this.setState({ film: (s.film + 1) % t.look.length, lookOpen: -1 })
      }
    };
  }
}
</script>
</body>
</html>
